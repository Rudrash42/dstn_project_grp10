# ═══════════════════════════════════════════════════════════════
#  ⚡ Hardware Cache Configuration
# ═══════════════════════════════════════════════════════════════
#
#  Edit these values to match YOUR hardware (RTX 3050 laptop).
#  This file is loaded by train_hardware.py and evaluate_hardware.py.
#
#  🔑 KEY INSIGHT:
#  If L1 is too big → all chunks fit in GPU → agent learns nothing.
#  If L1 is too small → everything is a cold miss → agent can't help.
#  Find the sweet spot where ~50% of chunks fit in L1.
#
# ═══════════════════════════════════════════════════════════════

# ── Chunk Geometry (from your LLM model: Qwen2.5-0.5B) ──────
chunk_size_tokens: 256
kv_bytes_per_token: 12288       # 2 × 24L × 2H × 64d × 2B
chunk_size_bytes: 3145728       # 256 × 12288 = 3 MB per chunk

# ── Tier Capacities ──────────────────────────────────────────
# L1 = GPU VRAM (RTX 3050 has 4096 MB total)
# Keep this SMALL so chunks spill to L2/L3 — that's the whole point!
l1_capacity_mb: 9.0            # changed this ~15 chunks fit (good pressure)

# L2 = CPU Pinned RAM (your laptop's system RAM)
# Don't set too high — pinned memory can't be swapped to disk
l2_capacity_mb: 12.0            # changed this ~16 chunks fit

# L3 = NVMe Disk (your SSD — plenty of space)
l3_capacity_mb: 5120.0          # ~1600 chunks fit

# ── Where to store L3 chunk files on disk ────────────────────
l3_disk_dir: "./data/hardware_cache_store"

# ── Estimated Latencies (for baseline reward computation) ────
# These are used to estimate "what would happen without prefetch"
# The ACTUAL access latencies are always MEASURED on real hardware.
l1_hit_latency_ms: 0.1
l2_hit_latency_ms: 0.24
l3_hit_latency_ms: 6.0
cold_compute_per_chunk_ms: 30.8
prefetch_l3_to_l2_ms: 6.0

# ── Reward Function ─────────────────────────────────────────
# R = α × time_saved - β × MB_migrated - γ × unused_prefetches
alpha: 1.0           # higher = reward time savings more
beta: 0.01           # higher = penalize data migration more
gamma_reward: 0.1    # higher = penalize wasted prefetches more

# ── RL Training Hyperparameters ──────────────────────────────
learning_rate: 0.0003
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma_discount: 0.99
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
total_timesteps: 50000

# ── Policy Network ───────────────────────────────────────────
policy_net_arch:
  - 64
  - 64

# ── Observation Space ────────────────────────────────────────
embed_dim: 384
max_candidate_chunks: 16
history_len: 5

# ── Behavioral Cloning (Stage A) ────────────────────────────
behavioral_cloning_epochs: 20
behavioral_cloning_lr: 0.001

# ── Hardware Flags ───────────────────────────────────────────
force_cpu_mode: false           # Set true to test without GPU
verbose: false                  # Set true to see every cache operation
enable_operation_log: true      # Log all ops for CSV export
cuda_warmup_iterations: 5       # GPU warmup before measurement
